name: Build Chunk Tracer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Installa Gradle 9.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4'

      - name: Compila il mod
        run: gradle build

      - name: Carica il jar compilato
        uses: actions/upload-artifact@v4
        with:
          name: chunk-tracer-jar
          path: build/libs/*.jar
